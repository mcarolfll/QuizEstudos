<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - QuizEstudos </title>
    <link rel="icon" type="image/png" href="../study.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-body">
    <div class="login-wrapper">
      <div class="login-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <div class="login-logo" style="margin-bottom: 0;">QuizEstudos</div>
          <label class="switch">
            <span class="sun"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="#ffd43b"><circle r="5" cy="12" cx="12"></circle><path d="m21 13h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zm-17 0h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zm13.66-5.66a1 1 0 0 1 -.66-.29 1 1 0 0 1 0-1.41l.71-.71a1 1 0 1 1 1.41 1.41l-.71.71a1 1 0 0 1 -.75.29zm-12.02 12.02a1 1 0 0 1 -.71-.29 1 1 0 0 1 0-1.41l.71-.66a1 1 0 0 1 1.41 1.41l-.71.71a1 1 0 0 1 -.7.24zm6.36-14.36a1 1 0 0 1 -1-1v-1a1 1 0 0 1 2 0v1a1 1 0 0 1 -1 1zm0 17a1 1 0 0 1 -1-1v-1a1 1 0 0 1 2 0v1a1 1 0 0 1 -1 1zm-5.66-14.66a1 1 0 0 1 -.7-.29l-.71-.71a1 1 0 0 1 1.41-1.41l.71.71a1 1 0 0 1 0 1.41 1 1 0 0 1 -.71.29zm12.02 12.02a1 1 0 0 1 -.7-.29l-.66-.71a1 1 0 0 1 1.36-1.36l.71.71a1 1 0 0 1 0 1.41 1 1 0 0 1 -.71.24z"></path></g></svg></span>
            <span class="moon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path d="m223.5 32c-123.5 0-223.5 100.3-223.5 224s100 224 223.5 224c60.6 0 115.5-24.2 155.8-63.4 5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6-96.9 0-175.5-78.8-175.5-176 0-65.8 36-123.1 89.3-153.3 6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"></path></svg></span>
            <input type="checkbox" class="input" id="themeCheckbox">
            <span class="slider"></span>
          </label>
        </div>
        <h1 class="login-title">Bem-vindo!</h1>
        <p class="login-subtitle">Crie sua conta para começar a estudar.</p>

        <div class="form-group">
          <label class="form-label">Nome</label>
          <input type="text" id="loginName" class="form-input" placeholder="Como devemos te chamar?" />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="seu@email.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="Crie uma senha segura" />
        </div>

        <button class="primary-button login-button" id="loginSubmit">Entrar</button>
      </div>
    </div>

    <script>
      (function () {
        const STORAGE_KEY = 'quizApp_v1';

        // Theme Toggle Logic
        const themeCheckbox = document.getElementById('themeCheckbox');
        const body = document.body;

        // Check saved theme
        const savedTheme = localStorage.getItem('quizApp_theme');
        if (savedTheme === 'dark') {
          body.classList.add('dark-mode');
          if (themeCheckbox) themeCheckbox.checked = true;
        }

        if (themeCheckbox) {
          themeCheckbox.addEventListener('change', () => {
            if (themeCheckbox.checked) {
              body.classList.add('dark-mode');
              localStorage.setItem('quizApp_theme', 'dark');
            } else {
              body.classList.remove('dark-mode');
              localStorage.setItem('quizApp_theme', 'light');
            }
          });
        }

        function handleSubmit() {
          const name = document.getElementById('loginName').value.trim();
          const email = document.getElementById('loginEmail').value.trim();
          const password = document.getElementById('loginPassword').value.trim();

          if (!name || !email || !password) {
            alert('Por favor, preencha todos os campos obrigatórios (Nome, Email e Senha).');
            return;
          }

          // Simple email validation regex
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(email)) {
            alert('Por favor, insira um endereço de email válido.');
            return;
          }

          // Simulate notification
          alert(`Um email de confirmação foi enviado para ${email}. Verifique sua caixa de entrada para ativar as notificações.`);

          let data = { user: {}, quizzes: [] };
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            try {
              const parsed = JSON.parse(saved);
              if (parsed && typeof parsed === 'object') {
                data = {
                  user: parsed.user || {},
                  quizzes: parsed.quizzes || [],
                };
              }
            } catch (e) {
              console.error('Erro ao ler dados salvos:', e);
            }
          }

          data.user = {
            ...(data.user || {}),
            name,
            email,
            password,
          };

          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          window.location.href = 'inicio.html';
        }

        document.getElementById('loginSubmit').addEventListener('click', handleSubmit);
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            handleSubmit();
          }
        });
      })();
    </script>
  </body>
</html>
