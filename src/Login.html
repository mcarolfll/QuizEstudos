<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - QuizEstudos </title>
    <link rel="icon" type="image/png" href="../study.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-body">
    <div class="login-wrapper">
      <div class="login-card">
        <div class="login-logo">QuizEstudos</div>
        <h1 class="login-title">Bem-vindo!</h1>
        <p class="login-subtitle">Crie sua conta para começar a estudar.</p>

        <div class="form-group">
          <label class="form-label">Nome</label>
          <input type="text" id="loginName" class="form-input" placeholder="Como devemos te chamar?" />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="seu@email.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="Crie uma senha segura" />
        </div>

        <button class="primary-button login-button" id="loginSubmit">Entrar</button>
      </div>
    </div>

    <script>
      (function () {
        const STORAGE_KEY = 'quizApp_v1';

        function handleSubmit() {
          const name = document.getElementById('loginName').value.trim();
          const email = document.getElementById('loginEmail').value.trim();
          const password = document.getElementById('loginPassword').value.trim();

          if (!name || !email || !password) {
            alert('Preencha nome, email e senha.');
            return;
          }

          let data = { user: {}, quizzes: [] };
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            try {
              const parsed = JSON.parse(saved);
              if (parsed && typeof parsed === 'object') {
                data = {
                  user: parsed.user || {},
                  quizzes: parsed.quizzes || [],
                };
              }
            } catch (e) {
              console.error('Erro ao ler dados salvos:', e);
            }
          }

          data.user = {
            ...(data.user || {}),
            name,
            email,
            password,
          };

          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          window.location.href = 'inicio.html';
        }

        document.getElementById('loginSubmit').addEventListener('click', handleSubmit);
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            handleSubmit();
          }
        });
      })();
    </script>
  </body>
</html>
