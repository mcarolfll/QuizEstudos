<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizEstudos</title>
    <link rel="icon" type="image/png" href="../study.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
          <div class="logo">QuizEstudos</div>
        </div>
        <nav class="sidebar__nav">
          <button class="sidebar__item sidebar__item--active" data-view="dashboard">
            <span class="sidebar__icon">🏠</span>
            <span>Dashboard</span>
          </button>
          <button class="sidebar__item" data-view="quizzes">
            <span class="sidebar__icon">🧩</span>
            <span>Quizzes</span>
          </button>
          <button class="sidebar__item" data-view="performance">
            <span class="sidebar__icon">📈</span>
            <span>Desempenho</span>
          </button>
          <button class="sidebar__item" data-view="ranking">
            <span class="sidebar__icon">🏅</span>
            <span>Ranking</span>
          </button>
          <button class="sidebar__item" data-view="achievements">
            <span class="sidebar__icon">🏆</span>
            <span>Conquistas</span>
          </button>
          <button class="sidebar__item" data-view="notes">
            <span class="sidebar__icon">📝</span>
            <span>Anotações</span>
          </button>
          <button class="sidebar__item" data-view="profile">
            <span class="sidebar__icon">👤</span>
            <span>Perfil</span>
          </button>
        </nav>
      </aside>

      <div class="layout">
        <header class="topbar">
          <div class="topbar__left">
            <button class="menu-toggle" id="menuToggle" aria-label="Menu">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
            <div class="topbar__breadcrumbs">
              <span class="crumb" id="pageTitle">Dashboard</span>
            </div>
          </div>
         
          <div class="topbar__right">
        <label class="switch">
          <span class="sun"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="#ffd43b"><circle r="5" cy="12" cx="12"></circle><path d="m21 13h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zm-17 0h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zm13.66-5.66a1 1 0 0 1 -.66-.29 1 1 0 0 1 0-1.41l.71-.71a1 1 0 1 1 1.41 1.41l-.71.71a1 1 0 0 1 -.75.29zm-12.02 12.02a1 1 0 0 1 -.71-.29 1 1 0 0 1 0-1.41l.71-.66a1 1 0 0 1 1.41 1.41l-.71.71a1 1 0 0 1 -.7.24zm6.36-14.36a1 1 0 0 1 -1-1v-1a1 1 0 0 1 2 0v1a1 1 0 0 1 -1 1zm0 17a1 1 0 0 1 -1-1v-1a1 1 0 0 1 2 0v1a1 1 0 0 1 -1 1zm-5.66-14.66a1 1 0 0 1 -.7-.29l-.71-.71a1 1 0 0 1 1.41-1.41l.71.71a1 1 0 0 1 0 1.41 1 1 0 0 1 -.71.29zm12.02 12.02a1 1 0 0 1 -.7-.29l-.66-.71a1 1 0 0 1 1.36-1.36l.71.71a1 1 0 0 1 0 1.41 1 1 0 0 1 -.71.24z"></path></g></svg></span>
          <span class="moon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path d="m223.5 32c-123.5 0-223.5 100.3-223.5 224s100 224 223.5 224c60.6 0 115.5-24.2 155.8-63.4 5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6-96.9 0-175.5-78.8-175.5-176 0-65.8 36-123.1 89.3-153.3 6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"></path></svg></span>
          <input type="checkbox" class="input" id="themeCheckbox">
          <span class="slider"></span>
        </label>
        <div class="xp-display">
              <div class="xp-bar-container">
                <div class="xp-bar" id="headerXpBar" style="width: 0%"></div>
              </div>
              <span class="xp-text" id="headerLevel">Lvl 1</span>
            </div>
            <div class="user-pill">
              <div class="user-pill__avatar" id="userAvatar">S</div>
              <div class="user-pill__info">
                <span class="user-pill__name" id="userNameDisplay">Estudante</span>
                <span class="user-pill__role" id="userXp">0 XP</span>
              </div>
            </div>
          </div>
        </header>

        <main class="content" id="mainContent">
          <!-- Views will be injected here by JavaScript -->
        </main>
      </div>
    </div>

    <script src="js/questions.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
